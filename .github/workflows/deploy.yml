name: Deploy

# Uploads the application to the IONOS webspace over SFTP after CI passed on main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SFTP_HOST         e.g. access-xxxxxxxx.webspace-host.com (shown in the IONOS panel)
#   SFTP_USER         a dedicated SFTP user, ideally restricted to the cockpit folder
#   SFTP_PASSWORD     its password
#   SFTP_KNOWN_HOSTS  the server's host key line(s), so the connection is verified;
#                     obtain with `ssh-keyscan -p 22 <host>` and compare the fingerprint
#                     with the one IONOS publishes before saving it
#   SFTP_TARGET_DIR   path of the cockpit folder as the SFTP user sees it, e.g. /cockpit;
#                     the subdomain's document root must be <that folder>/public, the
#                     status subdomain's (optional) <that folder>/receiver
#
# Never deployed or deleted on the server: config/config.php, config/*.pem and var/.
# bin/deploy-sftp.sh refuses to deploy into a folder with foreign content.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo, pdo_mysql, sodium
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --classmap-authoritative

      - name: Assemble build
        run: |
          mkdir -p build/config
          cp -R public receiver src templates migrations cron vendor build/
          cp .htaccess composer.json build/
          cp config/config.example.php build/config/
          echo "Deployed by project-cockpit. Marks this directory as a deployment target; see bin/deploy-sftp.sh." > build/.cockpit-deploy

      - name: Check that all secrets are set
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
        run: |
          for name in SFTP_HOST SFTP_USER SFTP_PASSWORD SFTP_KNOWN_HOSTS SFTP_TARGET_DIR; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set."; exit 1; fi
          done

      - name: Upload over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Refuses to touch a directory that is not an earlier deployment of this project.
          bin/deploy-sftp.sh
