name: App

# The new Nuxt cockpit in app/: lint, types, unit tests, build, and the integration
# tests of the built server against MariaDB with every migration applied.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      mariadb:
        # Debian 13 on the VPS ships MariaDB 11.8.
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cockpit_test
          MARIADB_USER: cockpit
          MARIADB_PASSWORD: cockpit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # The ERP's integration tests call the PHP e-invoice engine (bin/invoice.php), as the server does.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo, pdo_mysql, sodium, dom, fileinfo, zip, gd
          coverage: none
      - name: PHP dependencies
        working-directory: .
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist
      - name: Integration tests
        env:
          # The tests drop and recreate this database.
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/cockpit_test
        run: npm run test:integration
