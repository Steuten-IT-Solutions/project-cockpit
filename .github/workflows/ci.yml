name: CI

# Pushes to main are checked by deploy.yml, which calls this workflow before uploading.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Same minor version as the servers (IONOS webspace, Debian 13 VPS).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo, pdo_mysql, sodium
          coverage: none

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint
        run: composer lint
      - name: Static analysis
        run: composer analyse
      - name: Tests
        run: composer test

  # The static company website (website/): no open placeholders, no inline code, no broken links.
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bin/check-website.sh
