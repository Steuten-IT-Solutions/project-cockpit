name: CI

# Pushes to main are checked by deploy.yml, which calls this workflow before uploading.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Same minor version as the IONOS webspace.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo, pdo_mysql, sodium
          coverage: none

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint
        run: composer lint
      - name: Static analysis
        run: composer analyse
      - name: Tests
        run: composer test
